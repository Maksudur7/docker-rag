version: '3.9'

services:
  app-1:
    build: ./app
    environment:
      - INSTANCE_NAME=App-1
  app-2:
    build: ./app
    environment:
      - INSTANCE_NAME=App-2
  app-3:
    build: ./app
    environment:
      - INSTANCE_NAME=App-3
  
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - app-1
      - app-2
      - app-3